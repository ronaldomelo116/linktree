    <!-- Widgets Superiores (Relógio e Clima) -->
    <header class="widgets-container">
        <div class="widget pixel-box" id="clock-widget">
            <span id="time">00:00:00</span>
        </div>
        
        <div class="widget pixel-box" id="weather-widget">
            <div class="weather-search">
                <input type="text" id="city-input" placeholder="Sua cidade..." value="Natal">
                <button id="search-weather">🔍</button>
            </div>
            <div class="weather-info">
                <span id="temp">--°C</span>
                <span id="condition">Buscando...</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <section class="profile-container">
            <div class="img-wrapper">

            </div>
            <h1 class="name">Ronaldo Mello</h1>
            <p class="bio">
                Olá meu nome é Ronaldo Mello faço de tudo um pouco, sou produtor de videos <span>(edição e animação)</span> editor de <span>(editor de imagens)</span>, e agora Aprendendo a Desenvolver Sites <span>(HTML, CSS e JavaScript)</span> - Desenvolvedor Front-End.

            <a href="https://github.com/ronaldomelo116" target="_blank" rel="noopener noreferrer" class="pixel-btn">
